name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with Gradle
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        else
          echo "Gradlew fayli topilmadi, sistemadagi Gradle ishlatilmoqda..."
          # Loyiha joylashgan papkani topamiz
          BUILD_GRADLE_PATH=$(find . -name "build.gradle*" | head -n 1)
          if [ -n "$BUILD_GRADLE_PATH" ]; then
            cd $(dirname "$BUILD_GRADLE_PATH")
          fi
          gradle assembleDebug --stacktrace
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NutriCal-AI-app
        path: '**/build/outputs/apk/debug/*.apk'
